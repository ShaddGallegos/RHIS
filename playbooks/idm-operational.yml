---
# IdM operational playbook (post-install tasks)
- name: Configure IdM operational settings (post-install)
  hosts: idm
  become: true
  gather_facts: true
  pre_tasks:
    - name: Early RHSM/Insights preflight (best-effort)
      ansible.builtin.include_role:
        name: minirhis-rhsm
  roles:
    - minirhis-idm-operational
