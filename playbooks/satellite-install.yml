---
- name: Satellite bootstrap and readiness
  hosts: sat_primary:scenario_satellite
  become: true
  gather_facts: true

  roles:
    - role: server_bootstrap
      # Satellite is heavy; base packages may be provided by satellite builders.
      server_packages: []
      open_9443: true
      ensure_httpd: false
      wait_for_web: false

  tasks:
    - name: Wait for Satellite HTTPS port to be available
      wait_for:
        port: 443
        timeout: 600

    - name: Probe Satellite web UI (https)
      uri:
        url: "https://{{ ansible_fqdn }}"
        validate_certs: no
        return_content: no
      register: sat_ui_check
      retries: 30
      delay: 10
      until: sat_ui_check.status is defined and sat_ui_check.status in [200,302]
      failed_when: sat_ui_check.status not in [200,302]

    - name: Check for Satellite services (best-effort)
      shell: |
        for svc in foreman tomcat httpd pulpcore-worker pulpcore-api; do
          systemctl status $svc --no-pager || true
        done
      register: sat_services
      changed_when: false
