---

- name: Satellite bootstrap and readiness
  hosts: satellite
  become: true
  gather_facts: true
  pre_tasks:
    - name: Wait for SSH connectivity to Satellite hosts
      ansible.builtin.wait_for_connection:
        timeout: 900
    - name: Early RHSM/Insights preflight (best-effort)
      ansible.builtin.include_role:
        name: mrhis-rhsm

  roles:
    - role: server_bootstrap
      # Satellite is heavy; base packages may be provided by satellite builders.
      server_packages: []
      open_9443: false
      ensure_httpd: false
      wait_for_web: true
      web_port: 443

  tasks:
    - name: Check for Satellite services (best-effort)
      ansible.builtin.shell: |
        for svc in foreman tomcat httpd pulpcore-worker pulpcore-api; do
          systemctl status $svc --no-pager || true
        done
      register: sat_services
      changed_when: false

    - name: Deploy image-mode provisioning template (copy only)
      ansible.builtin.include_role:
        name: mrhis-satellite-image
      vars:
        create_with_hammer: false
