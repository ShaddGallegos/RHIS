---
- name: Install and enable IdM (FreeIPA)
  hosts: idm_primary:idm
  become: true
  gather_facts: true

  vars:
    idm_packages:
      - freeipa-server
      - bind-dyndb-ldap
    idm_ds_pass: "{{ idm_admin_pass | default(global_admin_password |
      default('changeme')) }}"

  roles:
    - role: server_bootstrap
      server_packages: "{{ idm_packages }}"
      open_9443: true
      ensure_httpd: false
      wait_for_web: false

  tasks:
    - name: Check if IdM is already configured
      stat:
        path: /etc/ipa/default.conf
      register: ipa_conf

    - name: Run unattended IPA server install (idempotent)
      command: >
        ipa-server-install --unattended --realm={{ idm_realm }} --domain={{
        idm_domain }} --ds-password={{ idm_ds_pass }} --admin-password={{
        idm_admin_pass | default(global_admin_password | default('changeme')) }}
        --hostname={{ ansible_fqdn }}
      args:
        creates: /etc/ipa/default.conf
      when: not ipa_conf.stat.exists

    - name: Wait for IdM HTTPS port to be available
      wait_for:
        port: 443
        timeout: 300

    - name: Wait for IdM web UI to respond (https)
      uri:
        url: "https://{{ ansible_fqdn }}"
        validate_certs: no
        return_content: no
      register: ipa_ui_check
      retries: 12
      delay: 10
      until: ipa_ui_check.status is defined and ipa_ui_check.status in [200,302]
      failed_when: ipa_ui_check.status not in [200,302]

    - name: Ensure SELinux is permissive (baseline)
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Ensure httpd can make network connections (SELinux boolean)
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Install SELinux management utilities (semanage)
      package:
        name: policycoreutils-python-utils
        state: present

    - name: Add http port 9443 to SELinux http_port_t (best-effort)
      command: semanage port -a -t http_port_t -p tcp 9443
      args:
        warn: false
      register: semanage_add
      failed_when: false

    - name: Ensure firewalld is running (IdM)
      service:
        name: firewalld
        state: started
        enabled: true
      when: ansible_facts.os_family == 'RedHat'

    - name: Open firewall services required by IdM (permanent)
      firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: yes
      loop:
        - http
        - https
        - kerberos
        - ldap
        - ldaps
        - dns
      when: ansible_facts.os_family == 'RedHat'

    - name: Wait for IdM HTTPS port to be available
      wait_for:
        port: 443
        timeout: 300

    - name: Wait for IdM web UI to respond (https)
      uri:
        url: "https://{{ ansible_fqdn }}"
        validate_certs: no
        return_content: no
      register: ipa_ui_check
      retries: 12
      delay: 10
      until: ipa_ui_check.status is defined and ipa_ui_check.status in [200,302]
      failed_when: ipa_ui_check.status not in [200,302]
