---
- name: Update IdM passwords in vaulted env.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_file: "{{ lookup('env','HOME') + '/.ansible/conf/env.yml' }}"

  tasks:
    - name: Check for vaulted env file
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat

    - name: Fail if vaulted env file is missing
      ansible.builtin.fail:
        msg: "Vaulted env file {{ env_file }} not found. Create it first."
      when: not env_stat.stat.exists

    - name: Create temporary file for decrypted content
      ansible.builtin.tempfile:
        state: file
        prefix: env_decrypted_
        suffix: .yml
      register: tmpfile

    - name: Dump decrypted env.yml to temp file
      ansible.builtin.command: >-
        {%- if vault_password_file is defined -%} ansible-vault view "{{
        env_file }}" --vault-password-file "{{ vault_password_file }}"{%- else
        -%} ansible-vault view "{{ env_file }}"{%- endif %}
      register: env_plain
      changed_when: false
      no_log: true

    - name: Write decrypted content to temp file
      ansible.builtin.copy:
        dest: "{{ tmpfile.path }}"
        content: "{{ env_plain.stdout }}"
        mode: "0600"
      no_log: true

    - name: Load decrypted YAML into fact
      ansible.builtin.set_fact:
        env_data: "{{ lookup('file', tmpfile.path) | from_yaml }}"

    - name: Ensure env_data is a mapping
      ansible.builtin.set_fact:
        env_data: "{{ env_data or {} }}"

    - name: Generate ipadm_password if not provided
      ansible.builtin.command: |
        python3 - <<'PY'
        import secrets, string
        alphabet = string.ascii_letters + string.digits + '!@#$%&*()-_=+'
        print(''.join(secrets.choice(alphabet) for _ in range(16)))
        PY
      register: gen_ipadm
      changed_when: false
      when: ipadm_password is not defined
      no_log: true

    - name: Set ipadm_password fact
      ansible.builtin.set_fact:
        ipadm_password:
          "{{ gen_ipadm.stdout if ipadm_password is not defined else
          ipadm_password }}"
      no_log: true

    - name: Ensure ipaadmin_password defaults to ipadm if not provided
      ansible.builtin.set_fact:
        ipaadmin_password:
          "{{ ipaadmin_password if ipaadmin_password is defined else
          ipadm_password }}"
      no_log: true

    - name: Update ipadm_password if missing or too-short
      ansible.builtin.set_fact:
        env_data: "{{ env_data | combine({'ipadm_password': ipadm_password}) }}"
      when:
        env_data.ipadm_password is not defined or (env_data.ipadm_password is
        defined and (env_data.ipadm_password | length) < 8)
      no_log: true

    - name: Update ipaadmin_password if missing or too-short
      ansible.builtin.set_fact:
        env_data: "{{ env_data | combine({'ipaadmin_password': ipaadmin_password}) }}"
      when:
        env_data.ipaadmin_password is not defined or (env_data.ipaadmin_password
        is defined and (env_data.ipaadmin_password | length) < 8)
      no_log: true

    - name: Update idm_ds_pass and idm_admin_pass if missing or too-short
      ansible.builtin.set_fact:
        env_data: "{{ env_data | combine({'idm_ds_pass': ipadm_password,
          'idm_admin_pass': ipaadmin_password}) }}"
      when:
        (env_data.idm_ds_pass is not defined or (env_data.idm_ds_pass is defined
        and (env_data.idm_ds_pass | length) < 8)) or (env_data.idm_admin_pass is
        not defined or (env_data.idm_admin_pass is defined and
        (env_data.idm_admin_pass | length) < 8))
      no_log: true

    - name: Write updated YAML back to temp file
      ansible.builtin.copy:
        dest: "{{ tmpfile.path }}"
        content: "{{ env_data | to_nice_yaml }}"
        mode: "0600"
      no_log: true

    - name: Encrypt the temp file with ansible-vault
      ansible.builtin.command: >-
        {%- if vault_password_file is defined -%} ansible-vault encrypt "{{
        tmpfile.path }}" --vault-password-file "{{ vault_password_file }}"{%-
        else -%} ansible-vault encrypt "{{ tmpfile.path }}"{%- endif %}
      changed_when: true
      no_log: true

    - name: Backup original env.yml
      ansible.builtin.command: >-
        mv "{{ env_file }}" "{{ env_file }}.bak-{{ lookup('pipe', 'date
        +%Y%m%d%H%M%S') }}"
      when: env_stat.stat.exists
      changed_when: true

    - name: Move encrypted temp file into place
      ansible.builtin.command: >-
        mv "{{ tmpfile.path }}" "{{ env_file }}"
      changed_when: true

    - name: Show result
      ansible.builtin.debug:
        msg: "Updated ipadm_password/ipaadmin_password in {{ env_file }} (when
          missing/too-short)"
      no_log: true
