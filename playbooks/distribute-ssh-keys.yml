# Distribute installer SSH public key to target users
# Usage: ANSIBLE_CONFIG=~/.ansible/conf/minirhis-ansible.runtime.cfg \
#  ansible-playbook -i local/vars/external_inventory/hosts.yml \
#  --vault-password-file ~/.ansible/conf/.vaultpass.txt playbooks/distribute-ssh-keys.yml
 
- name: Distribute minirhis installer public key
  hosts: all
  gather_facts: false
  become: true

  roles:
    - role: minirhis-ssh-keys
      become: true
