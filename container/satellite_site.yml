---
# Satellite Site Configuration Playbook
# This playbook orchestrates the complete setup of a fully populated and configured
# Satellite instance using the rhis-builder-satellite roles and tasks.
# 
# Execution: ansible-playbook satellite_site.yml -i inventory/hosts
#
# Prerequisites:
#   - Satellite host provisioned and accessible
#   - Inventory configured with sat_primary group
#   - Variables configured (vault, host_vars, group_vars)
#   - All roles available in roles/ directory

- name: "RHIS Satellite - Phase 1: Foundation and Installation"
  hosts: sat_primary
  become: true
  gather_facts: true

  tasks:

    - name: "Load vault variables (file)"
      when: vault_path is defined
      ansible.builtin.include_vars:
        file: "{{ vault_path }}"
      tags:
        - always

    - name: "Load vault variables (directory)"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags:
        - always

    - name: "Load custom variables (file)"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"
      tags:
        - always

    - name: "Load custom variables (directory)"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags:
        - always

    - name: "Phase 1.1: Pre-installation preparation (disconnected mode)"
      when: satellite_disconnected | default(false)
      ansible.builtin.include_role:
        name: satellite_disconnected_pre
      tags:
        - tags_satellite_pre
        - tags_satellite_foundation

    - name: "Phase 1.2: Pre-installation preparation (connected mode)"
      ansible.builtin.include_role:
        name: satellite_pre
      tags:
        - tags_satellite_pre
        - tags_satellite_foundation

    - name: "Phase 1.3: Install Satellite"
      ansible.builtin.include_role:
        name: satellite
      tags:
        - tags_satellite_install
        - tags_satellite_foundation

    - name: "Phase 1.4: Post-installation configuration"
      ansible.builtin.include_role:
        name: satellite_post
      tags:
        - tags_satellite_post
        - tags_satellite_foundation

- name: "RHIS Satellite - Phase 2: Hammer and Manifest Configuration"
  hosts: sat_primary
  become: true
  gather_facts: true

  tasks:

    - name: "Load vault variables (file)"
      when: vault_path is defined
      ansible.builtin.include_vars:
        file: "{{ vault_path }}"
      tags:
        - always

    - name: "Load vault variables (directory)"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags:
        - always

    - name: "Load custom variables (file)"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"
      tags:
        - always

    - name: "Load custom variables (directory)"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags:
        - always

    - name: "Phase 2.1: Configure hammer CLI"
      ansible.builtin.import_tasks: "roles/rhis-builder-satellite/tasks/configure_hammer.yml"
      tags:
        - tags_configure_hammer
        - tags_satellite_config

    - name: "Phase 2.2: Configure Red Hat manifests (console.redhat.com)"
      ansible.builtin.include_role:
        name: redhat_manifests
      tags:
        - tags_manifest
        - tags_satellite_config

    - name: "Phase 2.3: Import manifests into Satellite"
      ansible.builtin.include_role:
        name: subscription_manifests
      tags:
        - tags_manifest
        - tags_satellite_config

    - name: "Phase 2.4: Configure REX Kerberos (if using IdM)"
      when:
        - satellite_pre_use_idm | default(false)
        - rex_kerberos_enabled | default(false)
      ansible.builtin.include_role:
        name: rex_kerberos
      tags:
        - tags_kerberos
        - tags_satellite_config

- name: "RHIS Satellite - Phase 3: Infrastructure Configuration"
  hosts: sat_primary
  become: true
