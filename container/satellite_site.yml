      tags:
        - always

    - name: "Load custom variables (file)"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"
      tags:
        - always

    - name: "Load custom variables (directory)"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags:
        - always

    - name: "Phase 3.1: Create organizations"
      ansible.builtin.include_role:
        name: organizations
      tags:
        - tags_infrastructure
        - tags_organizations

    - name: "Phase 3.2: Create locations"
      ansible.builtin.include_role:
        name: locations
      tags:
        - tags_infrastructure
        - tags_locations

    - name: "Phase 3.3: Create domains"
      ansible.builtin.include_role:
        name: domains
      tags:
        - tags_infrastructure
        - tags_domains

    - name: "Phase 3.4: Create subnets"
      ansible.builtin.include_role:
        name: subnets
      tags:
        - tags_infrastructure
        - tags_subnets

    - name: "Phase 3.5: Configure settings"
      ansible.builtin.include_role:
        name: settings
      tags:
        - tags_infrastructure
        - tags_settings

    - name: "Phase 3.6: Create realms (IdM integration)"
      when: satellite_pre_use_idm | default(false)
      ansible.builtin.include_role:
        name: realms
      tags:
        - tags_infrastructure
        - tags_realms

