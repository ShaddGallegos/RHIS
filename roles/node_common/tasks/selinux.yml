---
# SELinux: optionally set permissive using `minirhis_selinux_permissive` (default: false)
- name: Ensure SELINUX setting in /etc/selinux/config
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX={{ 'permissive' if (minirhis_selinux_permissive | default(false))
      else 'enforcing' }}"
    create: yes
  become: true

- name: Apply SELinux enforcement state at runtime (setenforce)
  ansible.builtin.command: setenforce 0
  when: minirhis_selinux_permissive | default(false)
  become: true
