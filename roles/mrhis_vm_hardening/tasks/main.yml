---
# Role: mrhis_vm_hardening
# Purpose: Post-install VM hardening tasks (minimal)
# This role ensures /etc/rc.d/rc.local is not executable after initial bootstrapping.
- name: Revert rc.local to non-executable
  ansible.builtin.file:
    path: /etc/rc.d/rc.local
    mode: "0644"
  ignore_errors: true
