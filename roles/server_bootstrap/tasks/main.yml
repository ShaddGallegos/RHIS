---
# Server bootstrap tasks: install packages, configure SELinux, firewalld, and optional web checks

- name: Normalize `base_packages` to a list
  ansible.builtin.set_fact:
    base_packages_list:
      "{{ base_packages.split() if base_packages is string else
      (base_packages | default([])) }}"

- name: Normalize `server_packages` to a list
  ansible.builtin.set_fact:
    server_packages_list:
      "{{ server_packages.split() if server_packages is string
      else (server_packages | default([])) }}"

# Ensure Java/keytool (keytool) is available for Puppet/Foreman installers
# This helps Puppet keystore providers that call the 'keytool' binary during
# foreman-installer / Puppet runs. Idempotent and tolerates missing JVMs.
- name: Check for keytool on system
  ansible.builtin.command: command -v keytool
  register: _keytool_check
  failed_when: false
  changed_when: false

- name: Search for JVM keytool under /usr/lib/jvm when keytool missing
  ansible.builtin.find:
    paths: /usr/lib/jvm
    patterns: keytool
    recurse: yes
    file_type: file
  register: _jvm_keytool
  when: _keytool_check.rc != 0

- name: Create symlink to JVM keytool in /usr/bin when found
  ansible.builtin.file:
    src: "{{ _jvm_keytool.files[0].path }}"
    dest: /usr/bin/keytool
    state: link
    force: true
  when:
    - _keytool_check.rc != 0
    - _jvm_keytool.matched | default(0) > 0

- name: Ensure java-17-openjdk-headless is installed when keytool still missing
  ansible.builtin.package:
    name: java-17-openjdk-headless
    state: present
  when: _keytool_check.rc != 0 and (_jvm_keytool.matched | default(0) == 0)

- name: Re-check keytool path and register it
  ansible.builtin.command: command -v keytool
  register: _keytool_path
  failed_when: false
  changed_when: false

- name: Create symlinks to keytool for Puppet's bin paths (if keytool available)
  ansible.builtin.file:
    src: "{{ _keytool_path.stdout }}"
    dest: "{{ item }}"
    state: link
    force: true
  loop:
    - /opt/puppetlabs/bin/keytool
    - /opt/puppetlabs/puppet/bin/keytool
    - /usr/local/bin/keytool
  when: _keytool_path.stdout is defined and _keytool_path.stdout != ''
  failed_when: false

- name: Ensure /etc/environment PATH contains puppet bin precedence
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^PATH="
    line: 'PATH="/opt/puppetlabs/bin:/usr/local/bin:/usr/bin:/sbin:/bin"'
    create: yes
    backup: yes
  when: ansible_facts.os_family == 'RedHat'

- name: Ensure puppet config path includes /opt/puppetlabs/bin (if puppet exists)
  ansible.builtin.stat:
    path: /opt/puppetlabs/bin/puppet
  register: _puppet_bin_stat
  when: ansible_facts.os_family == 'RedHat'

- name: Set puppet config path to include /opt/puppetlabs/bin when puppet present
  ansible.builtin.command: /opt/puppetlabs/bin/puppet config set path /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/puppetlabs/bin --section main
  failed_when: false
  changed_when: false
  when: ansible_facts.os_family == 'RedHat' and _puppet_bin_stat.stat.exists

- name: Include RHSM/Insights preflight role (best-effort)
  ansible.builtin.include_role:
    name: minirhis-rhsm
  # best-effort: let role handle failures and idempotence

- name: Install base and server-specific packages
  ansible.builtin.package:
    name: "{{ base_packages_list + server_packages_list }}"
    state: present


- name: Ensure `admin` user password matches `global_admin_password` (vaulted)
  become: true
  ansible.builtin.shell: set -o pipefail; echo "admin:{{ global_admin_password }}" | chpasswd
  when: global_admin_password is defined and global_admin_password | length > 0
  no_log: true
  changed_when: true

- name: Ensure firewalld is running and enabled (RedHat family)
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_facts.os_family == 'RedHat' and (manage_firewalld | default(true))

- name: Open bootstrap services (firewalld)
  ansible.posix.firewalld:
    ansible.builtin.service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ bootstrap_services | default([]) }}"
  when: ansible_facts.os_family == 'RedHat' and (manage_firewalld | default(true))

- name: Open port 9443/tcp (firewalld) when requested
  ansible.posix.firewalld:
    port: "9443/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: (open_9443 | default(false)) and ansible_facts.os_family == 'RedHat' and
    (manage_firewalld | default(true))

- name: Stop and disable firewalld when management is off (SOE)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when: ansible_facts.os_family == 'RedHat' and not (manage_firewalld | default(true))

- name: Ensure SELinux mode (best-effort)
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_state | default('permissive') }}"

- name: Ensure httpd can make network connections (SELinux boolean)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Install SELinux management utilities (semanage)
  ansible.builtin.package:
    name: policycoreutils-python-utils
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Add http port 9443 to SELinux http_port_t (best-effort)
  ansible.builtin.command: semanage port -a -t http_port_t -p tcp 9443
  register: semanage_add
  failed_when: false
  changed_when: semanage_add.rc == 0
  when: (open_9443 | default(false)) and ansible_facts.os_family == 'RedHat'

- name: Ensure httpd is enabled and started (if requested)
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  when: (ensure_httpd | default(false)) and ansible_facts.os_family == 'RedHat'
  failed_when: false

- name: Optionally wait for web UI port to be available
  ansible.builtin.wait_for:
    port: "{{ web_port | default(9443) }}"
    timeout: 300
  when: wait_for_web | default(false)

- name: Optionally probe web UI until healthy
  ansible.builtin.uri:
    url: >-
      {{ satellite_url if (satellite_url is defined and satellite_url|length > 0)
         else ('https://' + (sat_ip if (sat_ip is defined and sat_ip|length > 0)
         else (ansible_fqdn | default(inventory_hostname)))) }}
    validate_certs: false
    return_content: false
  register: ui_check_result
  retries: 12
  delay: 10
  until: ui_check_result.status is defined and ui_check_result.status in [200,302]
  when: wait_for_web | default(false)

# Persist a NAT redirect from 443 -> 8443 for services (e.g., AAP/nginx)
# Controlled by `persist_nat_443_to_8443` (default: false).
- name: Ensure nftables config directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    ansible.builtin.group: root
    mode: "0755"
  when: persist_nat_443_to_8443 | default(false) and ansible_facts.os_family ==
    'RedHat'

- name: Write minirhis NAT nft rules file
  ansible.builtin.copy:
    dest: /etc/nftables.d/minirhis-nat.nft
    owner: root
    ansible.builtin.group: root
    mode: "0644"
    content: |
      table ip nat {
          chain PREROUTING {
              type nat hook prerouting priority 0; policy accept;
              tcp dport 443 redirect to :8443
          }
      }
  when: persist_nat_443_to_8443 | default(false) and ansible_facts.os_family ==
    'RedHat'

- name: Install systemd unit to load minirhis nft rules at boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/minirhis-nat.service
    owner: root
    ansible.builtin.group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Load minirhis nft NAT rules
      After=network.target nftables.service
      Wants=nftables.service

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/minirhis-nat.nft
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: persist_nat_443_to_8443 | default(false) and ansible_facts.os_family ==
    'RedHat'

- name: Reload systemd and enable + start minirhis-nat service
  ansible.builtin.systemd:
    name: minirhis-nat.service
    daemon_reload: true
    enabled: true
    state: started
  when: persist_nat_443_to_8443 | default(false) and ansible_facts.os_family ==
    'RedHat'

- name: Apply minirhis nft rules immediately
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.d/minirhis-nat.nft
  register: nft_apply
  failed_when: nft_apply.rc not in [0,2]
  changed_when: nft_apply.rc == 0
  when: persist_nat_443_to_8443 | default(false) and ansible_facts.os_family ==
    'RedHat'

# Optional: share SSH keys between installer and this host. Controlled by
# the `share_ssh_keys` variable (default: false). When enabled this will:
# - push the minirhis installer and control public keys to `admin` and the
#   local operator user (if present) on the target host
# - fetch the target host's admin/operator public keys and add them to the
#   installer's `admin` authorized_keys so the controller can SSH back to installer.
- name: Share SSH keys between installer and target host
  when: share_ssh_keys | default(false)
  block:
    - name: Set operator_user from control environment
      ansible.builtin.set_fact:
        operator_user: "{{ lookup('env', 'USER') }}"

    - name: Install minirhis-installer public key for admin
      ansible.posix.authorized_key:
        user: "{{ admin_user | default('admin') }}"
        key: "{{ lookup('file', lookup('env', 'HOME') +
          '/.ssh/minirhis-installer/id_rsa.pub') }}"
        state: present
        manage_dir: true

    - name: Install control user's public key for admin
      ansible.posix.authorized_key:
        user: "{{ admin_user | default('admin') }}"
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
        state: present
        manage_dir: true

    - name: Check operator_user exists on this host
      ansible.builtin.getent:
        database: passwd
        key: "{{ operator_user }}"
      register: operator_getent
      failed_when: false

    - name: Install minirhis-installer public key for operator_user (if present)
      ansible.posix.authorized_key:
        user: "{{ operator_user }}"
        key: "{{ lookup('file', lookup('env', 'HOME') +
          '/.ssh/minirhis-installer/id_rsa.pub') }}"
        state: present
        manage_dir: true
      when:
        operator_getent.entries is defined and operator_getent.entries | length >
        0

    - name: Install control user's public key for operator_user (if present)
      ansible.posix.authorized_key:
        user: "{{ operator_user }}"
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
        state: present
        manage_dir: true
      when:
        operator_getent.entries is defined and operator_getent.entries | length >
        0

    - name: Slurp admin public key from this host (if present)
      ansible.builtin.slurp:
        src: "/home/{{ admin_user | default('admin') }}/.ssh/id_rsa.pub"
      register: admin_pub
      failed_when: false
      changed_when: false

    - name: Slurp operator public key from this host (if present)
      ansible.builtin.slurp:
        src: "/home/{{ operator_user }}/.ssh/id_rsa.pub"
      register: operator_pub
      failed_when: false
      changed_when: false

    - name: Save this host's admin public key to controller for later import
      ansible.builtin.copy:
        content: "{{ admin_pub.content | b64decode }}"
        dest: "/tmp/minirhis_node_keys/{{ inventory_hostname }}-{{ admin_user |
          default('admin') }}.pub"
        mode: "0644"
      delegate_to: localhost
      when: admin_pub is defined and admin_pub.content is defined and
        admin_pub.content | length > 0

    - name: Save this host's operator public key to controller for later import
      ansible.builtin.copy:
        content: "{{ operator_pub.content | b64decode }}"
        dest: "/tmp/minirhis_node_keys/{{ inventory_hostname }}-operator.pub"
        mode: "0644"
      delegate_to: localhost
      when: operator_pub is defined and operator_pub.content is defined and
        operator_pub.content | length > 0

# Red Hat Insights integration (optional)
- name: Configure Red Hat Insights integration
  when: ensure_insights | default(false) and ansible_facts.os_family == 'RedHat'
  block:
    - name: Ensure Red Hat Insights client is installed
      ansible.builtin.package:
        name: insights-client
        state: present

    - name: Register system with Red Hat Insights using RH credentials
      ansible.builtin.command: >-
        insights-client --register --username {{ rh_user | default(RH_USER |
        default('')) }} --password {{ rh_pass | default(RH_PASS | default(''))
        }}
      register: insights_register_result
      failed_when: false
      changed_when: insights_register_result.rc == 0
      when: (rh_user | default(RH_USER | default(''))) != '' and (rh_pass |
        default(RH_PASS | default(''))) != ''

    - name: Register system with Red Hat Insights (false credentials)
      ansible.builtin.command: insights-client --register
      register: insights_register_result_false_creds
      failed_when: false
      changed_when: insights_register_result_false_creds.rc == 0
      when: not ((rh_user | default(RH_USER | default(''))) != '' and (rh_pass |
        default(RH_PASS | default(''))) != '')

    - name: Report Insights registration result
      ansible.builtin.debug:
        msg: |
          Insights register rc={{ insights_register_result.rc | default(insights_register_result_false_creds.rc | default('unset')) }}
          out={{ insights_register_result.stdout | default(insights_register_result_false_creds.stdout | default('')) }}

    # Post-install and pre-configuration checks and automatic remediation
    - name: Post-install automated checks (registration, connectivity, logs)
      when: perform_post_install_checks | default(true)
      block:
        - name: Ensure subscription-manager and insights-client packages are present
          ansible.builtin.package:
            name:
              - subscription-manager
              - insights-client
            state: present
          register: _pkgs_installed

        - name: Attempt to register with Satellite or Red Hat if not already registered
          block:
            - name: Check subscription-manager identity
              ansible.builtin.command: subscription-manager identity
              register: _sm_identity
              failed_when: false
              changed_when: false

            - name: Register via Satellite activation key when provided
              ansible.builtin.command: >-
                subscription-manager register --org={{ cdn_organization_id }} --activationkey={{ cdn_sat_activation_key }} --force
              when:
                - _sm_identity.rc != 0
                - cdn_organization_id is defined
                - cdn_sat_activation_key is defined
              register: _sm_register_attempt
              failed_when: false
              changed_when: _sm_register_attempt.rc == 0

            - name: Register via Red Hat credentials when Satellite activation key not used
              ansible.builtin.command: >-
                subscription-manager register --username={{ rh_user | default('') }} --password={{ rh_pass | default('') }} --force
              when:
                - _sm_identity.rc != 0
                - not (cdn_organization_id is defined and cdn_sat_activation_key is defined)
                - (rh_user is defined and rh_pass is defined)
              register: _sm_register_attempt_2
              failed_when: false
              changed_when: _sm_register_attempt_2.rc == 0

            - name: Run subscription-manager attach --auto (best-effort)
              ansible.builtin.command: subscription-manager attach --auto
              failed_when: false
              changed_when: false
              when: _sm_identity.rc != 0

        - name: Ensure Insights client is registered and scheduled
          block:
            - name: Check insights-client status
              ansible.builtin.command: insights-client --status
              register: _ins_status
              failed_when: false
              changed_when: false

            - name: Register Insights client if not registered
              ansible.builtin.command: insights-client --register
              when: _ins_status.rc != 0
              register: _ins_register
              failed_when: false
              changed_when: _ins_register.rc == 0

            - name: Enable insights-client timer
              ansible.builtin.systemd:
                name: insights-client.timer
                state: started
                enabled: true
              failed_when: false

        - name: Run quick package database check (dnf/yum)
          ansible.builtin.command: >-
            {{ 'dnf check' if ansible_facts.pkg_mgr == 'dnf' else 'yum check' }}
          register: _pkg_check
          failed_when: false
          changed_when: false

        - name: Determine interface used for default route
          ansible.builtin.set_fact:
            _default_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"

        - name: Check internet connectivity via default interface
          ansible.builtin.command: ping -I {{ _default_iface }} -c 3 {{ internet_check_host | default('8.8.8.8') }}
          register: _internet_check
          failed_when: false
          changed_when: false

        - name: Build list of internal targets to verify reachability
          ansible.builtin.set_fact:
            _internal_targets: >-
              {{ ([aap_ip, idm_ip, sat_ip] | default([])) + (internal_test_ips | default([])) | select('defined') | list }}

        - name: Ping internal test targets
          ansible.builtin.command: ping -c 3 {{ item }}
          loop: "{{ _internal_targets }}"
          register: _internal_ping_results
          failed_when: false
          changed_when: false
          when: _internal_targets | length > 0

        - name: Gather journal error and warning snippets
          ansible.builtin.command: >-
            bash -c "journalctl -p 3 -n 200 --no-pager; echo '----WARNINGS----'; journalctl -p 4 -n 200 --no-pager"
          register: _journal_snippets
          failed_when: false
          changed_when: false

        - name: Report post-install check summary
          ansible.builtin.debug:
            msg: |
              post_install: subscription_identity_rc={{ _sm_identity.rc | default('unset') }}
              subscription_register_rc={{ _sm_register_attempt.rc | default(_sm_register_attempt_2.rc | default('unset')) }}
              insights_status_rc={{ _ins_status.rc | default('unset') }}
              dnf_check_rc={{ _pkg_check.rc | default('unset') }}
              internet_check_rc={{ _internet_check.rc | default('unset') }}
              internal_ping_results={{ _internal_ping_results.results | default([]) }}
              journal_snippets={{ (_journal_snippets.stdout_lines | default([]))[:80] }}

        - name: Fail the play if critical failures detected (subscription or internet)
          ansible.builtin.fail:
            msg: "Critical post-install checks failed: subscription or internet unreachable"
          when: >-
            (_sm_identity.rc != 0 and (_sm_register_attempt.rc | default(_sm_register_attempt_2.rc | default(1))) != 0)
            or (_internet_check.rc is defined and _internet_check.rc != 0)
