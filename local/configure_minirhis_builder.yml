---

- name: "Configure minirhis-builder projects"
  hosts: localhost
  gather_facts: false
  vars:
    minirhis_root_dir: "/minirhis"
    default_inventory_link: "/minirhis/vars/external_inventory"
    default_external_tasks_link: "/minirhis/vars/external_tasks"
    default_files_link: "/minirhis/vars/files"
    default_group_link: "/minirhis/vars/group_vars"
    default_host_link: "/minirhis/vars/host_vars"
    default_template_link: "/minirhis/vars/templates"
    default_vars_link: "/minirhis/vars/vars"
    default_vault_link: "/minirhis/vars/vault"
    project_list:
      - name: "minirhis-builder-idm"
        repo: "https://github.com/parmstro/minirhis-builder-idm.git"
        purge: true
      - name: "minirhis-builder-satellite"
        repo: "https://github.com/parmstro/minirhis-builder-satellite.git"
        purge: true
      - name: "minirhis-builder-pipelines"
        repo: "https://github.com/parmstro/minirhis-builder-pipelines.git"
        purge: true
      - name: "minirhis-builder-aap"
        repo: "https://github.com/parmstro/minirhis-builder-aap.git"
        purge: true
      - name: "minirhis-builder-day-2-ops"
        repo: "https://github.com/parmstro/minirhis-builder-day-2-ops.git"
        purge: true
      - name: "minirhis-builder-nbde"
        repo: "https://github.com/parmstro/minirhis-builder-nbde.git"
        purge: true
      - name: "minirhis-builder-imagebuilder"
        repo: "https://github.com/parmstro/minirhis-builder-imagebuilder.git"
        purge: true
      - name: "minirhis-builder-yubi"
        repo: "https://github.com/parmstro/minirhis-builder-yubi.git"
        purge: true
      - name: "minirhis-builder-convert2rhel"
        repo: "https://github.com/parmstro/minirhis-builder-convert2rhel.git"
        purge: true
      - name: "minirhis-builder-ansible-ee"
        repo: "https://github.com/parmstro/minirhis-builder-ansible-ee.git"
        purge: true
      - name: "minirhis-builder-quadlet-deploy"
        repo: "https://github.com/parmstro/minirhis-builder-quadlet-deploy.git"
        purge: true

  tasks:

    - name: "Clone each of the project to the container"  # noqa git[latest]  we always want the latest main when we build the container.
      ansible.builtin.git:
        repo: "{{ project.repo }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}"
        clone: true
        version: "main"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete any inventory for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/inventory"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the inventory directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_inventory_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/inventory"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete any external_tasks directory for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/external_tasks"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the external_tasks directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_external_tasks_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/external_tasks"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete the files directories for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/files"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the files directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_files_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/files"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete the group_vars directories for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/group_vars"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the group_vars directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_group_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/group_vars"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete the host_vars directories for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/host_vars"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the host_vars directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_host_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/host_vars"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete the templates directories for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/templates"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the templates directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_template_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/templates"
        state: link
        mode: "0644"
        force: true
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete any vars directory for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/vars"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the vars directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_vars_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/vars"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete any vault directory for each project"
      when: project.purge
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/{{ project.name }}/vault"
        state: absent
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Link the inventory directory to the bind mount directory"
      when: project.purge
      ansible.builtin.file:
        src: "{{ default_vault_link }}"
        dest: "{{ minirhis_root_dir }}/{{ project.name }}/vault"
        state: link
        mode: "0644"
      loop: "{{ project_list }}"
      loop_control:
        loop_var: project

    - name: "Delete any vault files for minirhis-builder-inventory"
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/minirhis-builder-inventory/vault"
        state: absent

    - name: "Delete any vault files for minirhis-builder-inventory"
      ansible.builtin.file:
        path: "{{ minirhis_root_dir }}/minirhis-builder-pipelines/vmware/vars/vault.yml"
        state: absent
