name: Ansible CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible ansible-lint yamllint

      - name: Ansible syntax-check (rhis_sat_config)
        run: |
          ansible-playbook --syntax-check reports/syntax_check_rhis_sat_config.yml -i localhost,

      - name: Ansible syntax-check (rhis_builder_satellite)
        run: |
          ansible-playbook --syntax-check reports/syntax_check_rhis_builder_satellite.yml -i localhost,

      - name: Run ansible-lint on roles
        run: |
          ansible-lint container/roles || true
