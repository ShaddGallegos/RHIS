---
name: Ansible CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ansible-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml . || true

      - name: Check FQCN usage
        run: |
          python3 scripts/ansible_fqcn_check.py

      - name: Run ansible-lint
        run: |
          ansible-lint || true

      - name: Ansible syntax check for playbooks
        run: |
          for f in $(git ls-files 'playbooks/*.yml' 'playbooks/*.yaml'); do
            ansible-playbook --syntax-check "$f" || true;
          done
