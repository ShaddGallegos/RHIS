name: Ansible CI checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml . || true

      - name: Run ansible-lint
        run: |
          ansible-lint || true

      - name: Ansible syntax check for playbooks
        run: |
          for f in $(git ls-files 'playbooks/*.yml' 'playbooks/*.yaml'); do 
            ansible-playbook --syntax-check "$f" || true; 
          done
---
name: Ansible CI

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Ansible syntax-check (configure_minirhis_builder)
        run: |
          ansible-playbook --syntax-check \
            container/configure_minirhis_builder.yml \
            -i localhost,

      - name: YAML lint (tracked YAML files)
        run: |
          yamllint -d relaxed \
            container/configure_minirhis_builder.yml \
            container/requirements.yml \
            container/vars/external_inventory/hosts.yml \
            host_vars/*.SAMPLE

      - name: Run ansible-lint (configure_minirhis_builder)
        run: |
          ansible-lint container/configure_minirhis_builder.yml || true
