[defaults]
# Local repository Ansible defaults. These mirror the runtime defaults used
# by the provisioner so ad-hoc and containerized runs behave consistently.
inventory = ./inventory/hosts.SAMPLE
host_key_checking = False
retry_files_enabled = False
# Include project `roles/` plus container-local builder roles so both
# repository-level and builder roles are discovered by Ansible.
roles_path = ./container/roles/minirhis-builder-satellite/roles:./container/roles/minirhis-builder-idm/roles:./container/roles/minirhis-builder-aap/roles:./roles
stdout_callback = ansible.builtin.default
# Force colorized output when running Ansible from terminals/scripts
force_color = True
result_format = yaml
interpreter_python = auto_silent
remote_tmp = /var/tmp
forks = 15
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/conf/facts-cache
fact_caching_timeout = 86400
callbacks_enabled = ansible.posix.profile_tasks,ansible.posix.timer
bin_ansible_callbacks = True
log_path = ~/.ansible/conf/ansible-provisioner.log
nocows = 1
inject_facts_as_vars = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardX11=no -i ~/.ssh/minirhis-installer/id_rsa
control_path_dir = /tmp/.ansible-cp
retries = 3

[galaxy]
server_list = published, validated, community_galaxy

[galaxy_server.published]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# token sourced from vaulted var vault_console_redhat_token (fallback HUB_TOKEN)
# This placeholder is populated from ~/.ansible/conf/env.yml (VAULT_CONSOLE_REDHAT_TOKEN / HUB_TOKEN)
token = {{ ah_token }}

[galaxy_server.validated]
url = https://console.redhat.com/api/automation-hub/content/validated/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# token sourced from vaulted var vault_console_redhat_token (fallback HUB_TOKEN)
# This placeholder is populated from ~/.ansible/conf/env.yml (VAULT_CONSOLE_REDHAT_TOKEN / HUB_TOKEN)
token = {{ ah_token }}

[galaxy_server.community_galaxy]
url = https://galaxy.ansible.com/
